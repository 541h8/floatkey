name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project layout
        run: |
          set -e
          echo "== current files =="
          ls -la
          mkdir -p \
            .github/workflows \
            app/src/main/assets \
            app/src/main/java/com/floatkey/app \
            app/src/main/res/drawable \
            app/src/main/res/mipmap-anydpi-v26 \
            app/src/main/res/values \
            app/src/main/res/xml \
            gradle/wrapper

          # move files only if they exist at the flat location
          mv -f build-apk.yml .github/workflows/ 2>/dev/null || true
          mv -f proguard-rules.pro app/ 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv -f keyboard.html app/src/main/assets/ 2>/dev/null || true
          mv -f FloatKeyApp.java app/src/main/java/com/floatkey/app/ 2>/dev/null || true
          mv -f FloatingKeyboardService.java app/src/main/java/com/floatkey/app/ 2>/dev/null || true
          mv -f KeyboardAccessibilityService.java app/src/main/java/com/floatkey/app/ 2>/dev/null || true
          mv -f MainActivity.java app/src/main/java/com/floatkey/app/ 2>/dev/null || true
          mv -f SettingsActivity.java app/src/main/java/com/floatkey/app/ 2>/dev/null || true
          mv -f ic_launcher_back.xml app/src/main/res/drawable/ 2>/dev/null || true
          mv -f ic_launcher_front.xml app/src/main/res/drawable/ 2>/dev/null || true
          mv -f ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
          mv -f strings.xml app/src/main/res/values/ 2>/dev/null || true
          mv -f accessibility_service_config.xml app/src/main/res/xml/ 2>/dev/null || true
          mv -f gradle-wrapper.properties gradle/wrapper/ 2>/dev/null || true

          echo "== layout after reconstruction =="
          find . -path ./.git -prune -o -type f -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify sources present
        run: |
          for f in app/src/main/AndroidManifest.xml \
                   app/src/main/assets/keyboard.html \
                   app/src/main/java/com/floatkey/app/MainActivity.java \
                   app/src/main/java/com/floatkey/app/FloatingKeyboardService.java \
                   app/src/main/java/com/floatkey/app/KeyboardAccessibilityService.java \
                   app/src/main/java/com/floatkey/app/SettingsActivity.java \
                   app/src/main/java/com/floatkey/app/FloatKeyApp.java \
                   app/src/main/res/xml/accessibility_service_config.xml \
                   app/src/main/res/values/strings.xml; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Grant execute permission
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatKey-APK
          path: app/build/outputs/apk/debug/app-debug.apk
